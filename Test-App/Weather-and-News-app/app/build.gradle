apply plugin: 'com.android.application'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "nl.cs.vu.android_prefetching_2018"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
    okhttpVersion = '3.14.8'
    roomRuntimeVersion = '2.2.5'
    lifecycleVersion = '2.2.0'
    rxjavaVersion = '2.1.15'
    espressoCoreVersion = '3.2.0'
    runnerVersion = '1.2.0'
    appcompatVersion = '1.1.0'
    materialVersion = '1.1.0'
    cardviewVersion = '1.0.0'
    gsonVersion = '2.8.5'
    constraintlayoutVersion = '1.1.3'
    diffMatchPatch = '1.1'
    nappaVersion = '1.0.1'
}

dependencies {
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation "androidx.cardview:cardview:$cardviewVersion"

    implementation name: 'android_prefetching_lib-debug', ext: 'aar'

    implementation "org.bitbucket.cowwoc:diff-match-patch:$diffMatchPatch"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "androidx.room:room-runtime:$roomRuntimeVersion"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycleVersion"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycleVersion"
    implementation "io.reactivex.rxjava2:rxjava:$rxjavaVersion"


    testImplementation "junit:junit:4.12"
    androidTestImplementation "androidx.test:runner:$runnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"

}
