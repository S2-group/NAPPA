apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
    okhttpVersion = '3.14.8'
    roomRuntimeVersion = '2.2.5'
    lifecycleVersion = '2.2.0'
    espressoCoreVersion = '3.2.0'
    runnerVersion = '1.2.0'
    diffMatchPatch = '1.1'
    jetbrainsAnnotation = '19.0.0'
    junitVersion = '1.1.1';
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    api group: 'org.jetbrains', name: 'annotations', version: jetbrainsAnnotation

    implementation "org.bitbucket.cowwoc:diff-match-patch:$diffMatchPatch"

    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "androidx.room:room-runtime:$roomRuntimeVersion"
    annotationProcessor "androidx.room:room-compiler:$roomRuntimeVersion"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycleVersion"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycleVersion"

    implementation files('libs')

    testImplementation "junit:junit:4.12"
    androidTestImplementation "androidx.test.ext:junit:$junitVersion"
    androidTestImplementation "androidx.test:runner:$runnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"
    androidTestImplementation "androidx.room:room-testing:$roomRuntimeVersion"
}
